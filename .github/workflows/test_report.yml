name: Manual Test Discord Report

on:
  workflow_dispatch: # 这个配置允许你在网页上点击按钮立即运行
  schedule:
    - cron: '0 2 * * 1' # 每周一北京时间上午 10:00 (UTC 2:00)

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install discord.py openai requests python-dotenv


      - name: Run Script
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}      
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }} 
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          FEISHU_REFERENCE_TABLE_ID: ${{ secrets.FEISHU_REFERENCE_TABLE_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python discord_weekly_report.py