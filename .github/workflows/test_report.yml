name: Daily Discord Report

on:
  workflow_dispatch:
    inputs:
      send_mode:
        description: "发送模式：test 发个人，prod 发群"
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
  schedule:
    - cron: '0 2 * * *' # 每天北京时间上午 10:00 (UTC 2:00)

permissions:
  contents: read
  actions: read

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install discord.py openai requests python-dotenv

      - name: Restore SQLite DB from Artifact
        uses: actions/cache@v4
        with:
          path: threads.db
          key: discord-threads-db-${{ github.ref_name }}
          restore-keys: |
            discord-threads-db-

      - name: Validate Test Target
        env:
          FEISHU_SEND_MODE: ${{ github.event_name == 'schedule' && 'prod' || github.event.inputs.send_mode }}
          FEISHU_TEST_RECEIVE_ID: ${{ secrets.FEISHU_TEST_RECEIVE_ID }}
        run: |
          if [ "$FEISHU_SEND_MODE" = "test" ] && [ -z "$FEISHU_TEST_RECEIVE_ID" ]; then
            echo "ERROR: FEISHU_SEND_MODE=test 但未配置 FEISHU_TEST_RECEIVE_ID，已阻止执行。"
            exit 1
          fi

      - name: Run Script
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
          FEISHU_REFERENCE_TABLE_ID: ${{ secrets.FEISHU_REFERENCE_TABLE_ID }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_SEND_MODE: ${{ github.event_name == 'schedule' && 'prod' || github.event.inputs.send_mode }}
          FEISHU_TEST_RECEIVE_ID: ${{ secrets.FEISHU_TEST_RECEIVE_ID }}
          FEISHU_TEST_RECEIVE_ID_TYPE: ${{ secrets.FEISHU_TEST_RECEIVE_ID_TYPE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python discord_weekly_report.py

      - name: Save SQLite DB to Artifact
        if: always()
        uses: actions/cache/save@v4
        with:
          path: threads.db
          key: discord-threads-db-${{ github.ref_name }}
